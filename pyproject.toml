[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mutatedsequence"
version = "2.0.0"
description = "Allele-aware mutated transcript, CDS and protein sequences from VCF + Ensembl annotation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mutatedseq = "mutatedseq.cli:main"

[tool.setuptools.packages.find]
include = ["mutatedseq*"]
